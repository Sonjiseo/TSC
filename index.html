<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSC 학습 페이지</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4ed;color:#183d36;font:16px/1.6 system-ui,sans-serif;word-break:keep-all}
header{background:#15473e;color:#fff;padding:40px 16px 32px;text-align:center}
header small{color:#bce5b8;letter-spacing:.1em}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.05em;margin:.2em 0}
header p{margin:0;color:#e2eee8}
main{max-width:820px;margin:auto;padding:24px 16px 60px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
a.card,div.card{display:block;background:#fffefa;border:1px solid #d4dfd4;border-radius:18px;padding:20px 22px;color:inherit;text-decoration:none}
a.card:hover{border-color:#205648;box-shadow:0 4px 14px rgba(21,71,62,.12)}
.card b{display:block;font-size:20px;color:#155847}
.card span{color:#587367;font-size:14px}
div.card{opacity:.5}
</style>
</head>
<body>
<header>
  <small>TSC · 中国语口语考试</small>
  <h1>TSC 학습 페이지</h1>
  <p>파트별 말하기 연습</p>
</header>
<main>
  <a class="card" href="part2/"><b>2부분 · 看图回答</b><span>그림 보고 답하기 연습장</span></a>
  <div class="card"><b>3부분</b><span>준비 중</span></div>
  <div class="card"><b>4부분</b><span>준비 중</span></div>
</main>
</body>
</html>
