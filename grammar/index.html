<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSC 문법·표현</title>
<meta name="description" content="TSC 문법 교재 정리 — 교재 어법, 추가 문법, 업그레이드 표현, 통째 암기 문장, 연습 카드">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/app.js"></script>
<script src="../assets/words.js"></script>
<script src="../vocab/data.js"></script>
<script src="../vocab/measure.js"></script>
<script src="../vocab/lexpick.js"></script>
<script src="data.js"></script>
</head>
<body class="has-bottom">
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">TSC 문법·표현</div>
    <h1>문법과 표현</h1>
    <p>문법 교재(03~15과 어법 익히기, 업그레이드 표현 공식 1)를 정리하고, 3급 답변에 꼭 쓰는 문법·표현·통째 암기 문장을 더했어요. 공식을 보고 → 예문을 먼저 말해 보고 → 눌러서 확인하세요.</p>
  </section>
  <nav class="tabs bottom" id="tabs" aria-label="문법 메뉴"></nav>
  <section id="view" aria-live="polite"></section>
  <p class="foot">외운 표시는 이 기기 브라우저에만 저장돼요.</p>
</main>
<script>
const T = TSC, {esc, $} = T, G = window.GR;
T.topbar({title: '문법·표현', sub: 'TSC 중국어 말하기'});
T.save('tsc-last', {href: 'grammar/', name: '문법·표현'});

/* 예문 속 단어 뜻: 단어장 단어 + 기본 단어 + 양사 + 문법 페이지 단어 */
window.VOC.forEach(c => c.words.forEach(w => T.addLex({py: w.py.replace(/\s*…\s*/g, ' ').replace(/\s+/g, ' ').trim(), hg: w.hg, parts: w.parts, ko: w.ko})));
T.addLexList(window.VOC_FUNC);
T.addLexList(window.MW.lex);
T.addLexList(G.lex);
const NUM = /^(yī|yí|yì|liǎng|èr|sān|sì|wǔ|liù|qī|bā|jiǔ|shí|líng|jǐ|[a-zāáǎàēéěèīíǐìōóǒòūúǔù]*(shí|bǎi|qiān)[a-zāáǎàēéěèīíǐìōóǒòūúǔù]*)$/;
T.lexPick = (key, list, c) => {
  const by = s => list.find(x => x.ko.includes(s));
  const after = c.keys.slice(c.i + 1);
  switch (key) {
    case 'jiàn': if (['lǐwù', 'yīfu', 'máoyī'].includes(c.next)) return list.find(x => x.ko.startsWith('양사')); break;
    case 'dài': if (c.next === 'yǔsǎn') return by('챙기'); break;
    case 'qián': if (c.prev === 'kuài') return by('돈'); break;
    case 'de': if (!c.next || ['ba', 'ma', 'shì'].includes(c.next)) {
        if (/^(wǒ|nǐ|tā|wǒmen|nǐmen|tāmen)$/.test(c.prev || '')) return by('의 것');
        const si = c.keys.indexOf('shì'); if (si > -1 && si < c.i) return by('강조');
        return by('한 것'); }
      if (['hěn', 'bù', 'fēicháng', 'tài', 'tǐng'].includes(c.next) && !/^(wǒ|nǐ|tā|wǒmen|nǐmen|tāmen)$/.test(c.prev || '')) return by('정도');
      if (['shuō', 'wèn', 'xiě', 'zǒu', 'kàn'].includes(c.next)) return by('하게'); return by('~의');
    case 'kuài': if (after.includes('le') && !NUM.test(c.prev || '')) return by('곧'); break;
    case 'jiào': if (c.prev === 'zài') return by('짖다'); break;
    case 'shí': if (/^(wǒ|nǐ|tā|wǒmen|tāmen)$/.test(c.next || '')) return by('때'); return by('10');
    case 'hào': if (c.keys.includes('fángjiān')) return by('호') || by('번호'); break;
    case 'le': if (c.i === c.keys.length - 1 && (c.keys.includes('kuài') || ['lěng', 'rè', 'kāichē', 'qù', 'xiàbān'].includes(c.prev))) return by('변화'); return by('완료');
  }
  return window.VOC_LEXPICK(key, list, c);
};
T.exampleSource = () => [...G.book.flatMap(u => u.points.flatMap(p => p.ex)), ...G.extra.flatMap(p => p.ex), ...G.up.flatMap(p => p.ex), ...G.memo.flatMap(m => m.rows)];

const view = $('#view');
const ALLP = [...G.book.flatMap(u => u.points.map(p => Object.assign(p, {unit: u}))), ...G.extra, ...G.up];
const prog = T.progress('gr');
const st = Object.assign({tab: 'book', unit: 'all', memo: 'all', src: 'book'}, T.load('tsc-gr-view', {}));
let onlyWrong = false;
const saveSt = () => T.save('tsc-gr-view', st);
function summary(){ const s = T.load('tsc-summary', {}); s.gr = {done: prog.count(ALLP.map(p => p.id)), total: ALLP.length}; T.save('tsc-summary', s); }

/* ===== 문법 카드 ===== */
const exRow = e => '<div style="margin-top:10px"><p class="ko" style="margin:0;font-size:15px">' + (e.tsc ? '<span class="badge accent" style="margin-right:6px">TSC 활용</span>' : '') + esc(e.ko) + '</p>' + T.revealHTML(T.sayHTML(e)) + '</div>';
function pcard(p, n){
  const s = T.markState('gr', p.id);
  return '<article class="card' + (s ? ' ' + s : '') + '" data-id="' + p.id + '"><div class="card-head"><span class="badge">' + n + '</span><span class="label" style="color:var(--ink);font-size:16px;flex:1">' + esc(p.t) + '</span>' + T.markBtns('gr', p.id) + '</div>' +
    '<p style="font-size:17px;font-weight:650;margin:0 0 4px;color:var(--brand-text)">' + esc(p.f) + '</p><p class="small muted" style="margin:0">' + esc(p.d) + '</p>' +
    (p.tip ? '<div class="tip small"><span>💡</span><span>' + esc(p.tip) + '</span></div>' : '') +
    p.ex.map(exRow).join('') +
    (p.fix ? '<p class="small muted" style="margin:10px 0 0">✏️ 사전 표기로 고침 — ' + esc(p.fix) + '</p>' : '') + '</article>';
}
const wrongN = list => list.filter(p => T.markState('gr', p.id) === 'wrong').length;
const filt = list => onlyWrong ? list.filter(p => T.markState('gr', p.id) === 'wrong') : list;
function statCard(list, label){
  const d = prog.count(list.map(p => p.id));
  return '<div class="card" id="statcard"><div class="stat"><b>' + d + '</b><span class="muted">/ ' + list.length + ' ' + label + '</span></div><div class="progress" style="margin-top:10px"><i style="width:' + (d / list.length * 100) + '%"></i></div></div>';
}

function viewBook(){
  const all = G.book.flatMap(u => u.points);
  let h = statCard(all, '교재 문법 외움') +
    '<div class="chips">' + [['all', '전체'], ...G.book.map(u => [u.id, u.lesson])].map(([id, n]) => '<button class="chip" type="button" data-unit="' + id + '" aria-pressed="' + (st.unit === id) + '">' + esc(n) + '</button>').join('') + '</div><div class="chips">' + T.wrongToggle(onlyWrong, wrongN(all)) + '</div>';
  const units = G.book.filter(u => st.unit === 'all' || u.id === st.unit);
  let any = false;
  units.forEach(u => {
    const ps = filt(u.points); if (!ps.length) return; any = true;
    h += '<h2 style="margin-top:22px">' + esc(u.lesson) + ' · ' + esc(u.ko) + '</h2><p class="small muted" style="margin:-4px 0 6px">' + esc(u.py) + ' · 교재 ' + esc(u.pages) + '</p>' + ps.map(p => pcard(p, u.points.indexOf(p) + 1)).join('');
  });
  if (!any) h += onlyWrong ? T.emptyWrong : '';
  view.innerHTML = h;
}
function viewExtra(){
  const ps = filt(G.extra);
  view.innerHTML = statCard(G.extra, '추가 문법 외움') +
    '<h2 style="margin-top:18px">추가 문법 <span class="badge accent" style="vertical-align:3px">교재 밖</span></h2><p class="small muted">교재에는 없지만 3급 답변에 꼭 쓰는 HSK 2~3급 기본 문법이에요. 예문은 새로 만든 문장이에요. 3부분 패턴 탭의 추가 패턴(guo, rúguǒ … jiù, xiān … ránhòu, yǐjīng … le)도 함께 보세요.</p>' +
    '<div class="chips">' + T.wrongToggle(onlyWrong, wrongN(G.extra)) + '</div>' +
    (ps.length ? ps.map(p => pcard(p, G.extra.indexOf(p) + 1)).join('') : T.emptyWrong);
}
function viewUp(){
  const book = filt(G.up.filter(p => !p.add)), add = filt(G.up.filter(p => p.add));
  view.innerHTML = statCard(G.up, '표현 외움') + '<div class="chips">' + T.wrongToggle(onlyWrong, wrongN(G.up)) + '</div>' +
    (book.length ? '<h2 style="margin-top:18px">업그레이드 표현 공식</h2><p class="small muted">교재 156~159쪽. 이런 표현을 하나씩 섞으면 답변이 길고 자연스러워져요.</p>' + book.map((p, i) => pcard(p, G.up.indexOf(p) + 1)).join('') : '') +
    (add.length ? '<h2 style="margin-top:28px">추가 표현 <span class="badge accent" style="vertical-align:3px">교재 밖</span></h2><p class="small muted">4~5부분에서 점수를 올리는 연결 표현이에요(HSK 3~4급). 예문은 새로 만든 문장이에요.</p>' + add.map(p => pcard(p, G.up.indexOf(p) + 1)).join('') : '') +
    (!book.length && !add.length ? T.emptyWrong : '');
}
function viewMemo(){
  const rows = G.memo.flatMap(m => m.rows);
  const d = T.progress('grm').count(rows.map(r => r.id));
  let h = '<div class="card"><div class="stat"><b>' + d + '</b><span class="muted">/ ' + rows.length + ' 문장 외움</span></div><p class="small muted" style="margin:8px 0 0">시험에서 바로 꺼내 쓰는 문장이에요. 통째로 외워 두면 답변 시작과 마무리가 편해져요. 교재 밖에서 새로 만든 문장이에요.</p></div>' +
    '<div class="chips">' + [['all', '전체'], ...G.memo.map(m => [m.id, m.part])].map(([id, n]) => '<button class="chip" type="button" data-memo="' + id + '" aria-pressed="' + (st.memo === id) + '">' + esc(n) + '</button>').join('') + '</div>';
  G.memo.filter(m => st.memo === 'all' || m.id === st.memo).forEach(m => {
    h += '<h2 style="margin-top:20px">' + esc(m.part) + ' <span class="small muted" style="font-weight:500">' + esc(m.desc) + '</span></h2>' +
      m.rows.map(r => { const s = T.markState('grm', r.id); return '<div class="card' + (s ? ' ' + s : '') + '" data-id="' + r.id + '" style="padding:12px 14px;margin:8px 0"><div class="row" style="align-items:flex-start"><p class="ko" style="margin:0;flex:1">' + esc(r.ko) + '</p>' + T.markBtns('grm', r.id) + '</div>' + T.revealHTML(T.sayHTML(r)) + '</div>'; }).join('');
  });
  view.innerHTML = h;
}

/* ===== 연습 카드: 한국어 → 중국어로 말하기 ===== */
const SRC = [['book', '교재 문법'], ['extra', '추가 문법'], ['up', '표현'], ['memo', '통암기'], ['wrong', '✗ 틀린 것']];
function cards(){
  const fromP = (ps, tag) => ps.flatMap(p => p.ex.filter(e => /[.?!]$/.test(e.py)).map((e, j) => ({id: p.id + ':' + p.ex.indexOf(e), e, hint: p.t, tag})));
  const all = [...fromP(G.book.flatMap(u => u.points), 'book'), ...fromP(G.extra, 'extra'), ...fromP(G.up, 'up'), ...G.memo.flatMap(m => m.rows.map(r => ({id: r.id, e: r, hint: m.part, tag: 'memo'})))];
  return st.src === 'wrong' ? all.filter(c => T.markState('grp', c.id) === 'wrong') : all.filter(c => c.tag === st.src);
}
let deck = [], dpos = 0;
function viewPractice(){
  const list = cards(), ids = list.map(c => c.id);
  let h = '<div class="chips" style="margin-top:14px">' + SRC.map(([k, n]) => '<button class="chip" type="button" data-src="' + k + '" aria-pressed="' + (st.src === k) + '">' + n + '</button>').join('') + '</div>';
  if (!list.length) h += T.emptyWrong;
  else {
    if (!deck.length || !deck.every(id => ids.includes(id))) { deck = ids.slice().sort(() => Math.random() - .5); dpos = 0; }
    if (dpos >= deck.length) h += '<div class="card center"><h3>한 바퀴 끝! 👏</h3><p class="muted">맞힌 카드 ' + T.progress('grp').count(deck) + ' / ' + deck.length + '</p><button class="btn primary" type="button" id="again">다시 섞어서 시작</button></div>';
    else {
      const c = list.find(x => x.id === deck[dpos]);
      h += '<div class="small muted">' + (dpos + 1) + ' / ' + deck.length + ' · ' + esc(c.hint) + '</div><div class="progress" style="margin:6px 0"><i style="width:' + (dpos / deck.length * 100) + '%"></i></div>' +
        '<div class="flash" id="flash"><button class="inner" type="button" aria-label="카드 뒤집기"><div class="face"><div class="small muted">중국어로 말해 보세요</div><div class="big-ko" style="font-size:22px">' + esc(c.e.ko) + '</div><div class="small muted">눌러서 뒤집기</div></div>' +
        '<div class="face back">' + T.sayHTML(c.e) + '<div class="small muted" style="margin-top:6px">' + esc(c.e.ko) + '</div></div></button></div>' + T.judgeBtns();
    }
  }
  view.innerHTML = h;
  const fl = $('#flash'); if (fl) fl.querySelector('.inner').onclick = e => { if (e.target.closest('.tw')) return; fl.classList.toggle('flipped'); };
  const next = ok => { const id = deck[dpos]; T.setMark('grp', id, ok ? 'done' : 'wrong'); if (!ok && st.src !== 'wrong') deck.push(id); dpos++; viewPractice(); };
  $('#yes') && ($('#yes').onclick = () => next(true));
  $('#no') && ($('#no').onclick = () => next(false));
  $('#again') && ($('#again').onclick = () => { deck = []; viewPractice(); });
}

const VIEWS = {book: viewBook, extra: viewExtra, up: viewUp, memo: viewMemo, practice: viewPractice};
const render = () => VIEWS[st.tab]();
view.addEventListener('click', e => {
  const u = e.target.closest('[data-unit]'); if (u) { st.unit = u.dataset.unit; saveSt(); render(); return; }
  const m = e.target.closest('[data-memo]'); if (m) { st.memo = m.dataset.memo; saveSt(); render(); return; }
  const s = e.target.closest('[data-src]'); if (s) { st.src = s.dataset.src; deck = []; saveSt(); render(); return; }
  if (e.target.closest('[data-wrongonly]')) { onlyWrong = !onlyWrong; render(); }
});
T.onMark = () => { summary(); const el = $('#statcard'); if (el && st.tab !== 'memo') { const list = st.tab === 'book' ? G.book.flatMap(u => u.points) : st.tab === 'extra' ? G.extra : G.up; const d = prog.count(list.map(p => p.id)); el.querySelector('.stat b').textContent = d; el.querySelector('.progress i').style.width = (d / list.length * 100) + '%'; } };

const TABS = [['book', '교재 문법', '📘'], ['extra', '추가 문법', '➕'], ['up', '표현', '⬆️'], ['memo', '통암기', '💬'], ['practice', '연습', '🃏']];
function go(t){ st.tab = t; onlyWrong = false; deck = []; saveSt(); T.tabs($('#tabs'), TABS, t, go); render(); scrollTo({top: 0}); }
T.tabs($('#tabs'), TABS, st.tab, go);
summary();
render();
</script>
</body>
</html>
