<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSC 2부분 그림 보고 답하기</title>
<meta name="description" content="TSC 2부분 그림 보고 답하기 — 교재 예제, 단어장, 문장 패턴, 부록, 실전 퀴즈">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/app.js"></script>
<script src="../assets/words.js"></script>
<script src="data.js"></script>
</head>
<body class="has-bottom">
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">TSC PART 2</div>
    <h1>2부분 그림 보고 답하기</h1>
    <p>4문항 · 준비 3초 · 답변 6초. 한국어를 보고 먼저 말해 본 뒤, 눌러서 병음과 한글 발음을 확인하세요.</p>
  </section>
  <nav class="tabs bottom" id="tabs" aria-label="학습 메뉴"></nav>
  <section id="view" aria-live="polite"></section>
  <p class="foot">외운 표시는 이 기기 브라우저에만 저장돼요.</p>
</main>
<script>
const T = TSC, {esc, $, $$} = T, D = window.P2;
T.topbar({title: '2부분 · 그림 보고 답하기', sub: 'TSC 중국어 말하기'});
T.save('tsc-last', {href: 'part2/', name: '2부분 그림 보고 답하기'});
const prog = T.progress('p2');
const view = $('#view');

/* ===== 데이터 정리 ===== */
const PAGES = ['행동','장소와 행동','사물의 위치','장소','가격','금액과 양사','날짜와 시각','측정','비교와 번호','위치와 층수'];
const RANGES = [[1,21],[22,43],[44,65],[66,86],[87,108],[109,120]];
const rowObj = r => ({py: r[1], hg: r[2], tones: r[3]});
const IDS = {
  ex: D.ex.map((_, i) => 'ex:' + i),
  vocab: D.v.flatMap((g, t) => g[1].map((_, i) => 'v:' + t + ':' + i)),
  pattern: [...D.patterns.map((_, i) => 'pt:' + i), ...D.app.map((_, i) => 'app:' + i)],
  appendix: D.appendix.map((_, i) => 'ap:' + i),
};
const ALL_IDS = Object.values(IDS).flat();
function summary(){ const s = T.load('tsc-summary', {}); s.p2 = {done: prog.count(ALL_IDS), total: ALL_IDS.length}; T.save('tsc-summary', s); }

/* ===== 조각 ===== */
const sayRow = r => T.revealHTML(T.sayHTML(rowObj(r), {noExpand: true}));
const glossHTML = k => { const w = D.gloss[k]; return w ? T.wordChip({py: w[1], hg: w[2], parts: w[3], ko: w[0]}) : ''; };
function studyNote(x){
  const n = D.notes[x[0][0] + x[1][0]]; if (!n) return '';
  const [title, grammar, tip] = D.rules[n[0]];
  return '<details class="more"><summary>단어 · 풀이 팁</summary><div class="words">' + n[1].map(glossHTML).join('') + '</div>' +
    (grammar ? '<div class="tip" style="background:var(--brand-soft)"><b style="color:var(--brand-text)">' + esc(title) + '</b><span>' + esc(grammar) + '</span></div>' : '') +
    '<div class="tip"><b>TIP</b><span>' + esc(n[2] || tip) + '</span></div></details>';
}
const pairInner = x => '<p class="small muted" style="margin:4px 0 0">질문</p><p class="ko" style="margin:0">' + esc(x[0][0]) + '</p>' + sayRow(x[0]) +
  '<p class="small muted" style="margin:12px 0 0">답변</p><p class="ko" style="margin:0">' + esc(x[1][0]) + '</p>' + sayRow(x[1]) + studyNote(x);
const pairCard = (x, id, label, extra = '') => '<article class="card' + (prog.has(id) ? ' done' : '') + '" data-id="' + id + '"><div class="card-head"><span class="badge">' + esc(label) + '</span><span class="label"></span>' + T.markBtns('p2', id) + '</div>' + extra + pairInner(x) + '</article>';
function rowCard(r, id, note, word){
  return '<div class="card' + (prog.has(id) ? ' done' : '') + '" data-id="' + id + '" style="padding:14px 16px;margin:8px 0"><div class="row"><span class="ko" style="flex:1">' + esc(r[0]) + '</span>' + (word ? '<button class="mark" type="button" aria-label="단어 자세히" title="단어 자세히" data-w="' + esc(JSON.stringify({py: r[1], hg: r[2], parts: r[3], ko: r[0]})) + '">' + T.icon.info + '</button>' : '') + T.markBtns('p2', id) + '</div>' + sayRow(r) +
    (note ? '<div class="tip"><b>TIP</b><span>' + esc(note) + '</span></div>' : '') + '</div>';
}
let lastProg = null;
const progressCard = (ids, label) => { lastProg = [ids, label]; const d = prog.count(ids); return '<div class="card" id="statcard"><div class="row"><div class="stat"><b>' + d + '</b><span class="muted">/ ' + ids.length + ' ' + label + '</span></div><span class="spacer"></span><button class="btn soft" type="button" data-go="quiz">⏱ 실전 퀴즈</button></div><div class="progress" style="margin-top:10px"><i style="width:' + (d / ids.length * 100) + '%"></i></div></div>'; };
const chips = (items, cur, attr) => '<div class="chips">' + items.map(([v, l, n]) => '<button class="chip" type="button" ' + attr + '="' + v + '" aria-pressed="' + (String(v) === String(cur)) + '">' + esc(l) + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>').join('') + '</div>';
function bindDone(){}

/* ===== 교재 예제 ===== */
let page = T.load('tsc-p2-page', 0);
function viewEx(){
  const ids = (i) => IDS.ex.slice(i * 4, i * 4 + 4);
  view.innerHTML = progressCard(IDS.ex, '교재 예제 외움') +
    chips(PAGES.map((p, i) => [i, (i + 9) + '쪽 ' + p, prog.count(ids(i)) + '/4']), page, 'data-page') +
    '<details class="card more" style="margin-top:4px"><summary>📷 교재 ' + (page + 9) + '쪽 원본 사진 (정답 포함)</summary><img class="photo" loading="lazy" alt="교재 ' + (page + 9) + '쪽 원본" src="' + D.imgs[page] + '"></details>' +
    D.ex.slice(page * 4, page * 4 + 4).map((x, i) => pairCard(x, 'ex:' + (page * 4 + i), (page + 9) + '쪽 · ' + (i + 1) + '번')).join('') +
    '<div class="row end">' + (page > 0 ? '<button class="btn" type="button" data-step="-1">← ' + (page + 8) + '쪽</button>' : '') + (page < 9 ? '<button class="btn primary" type="button" data-step="1">' + (page + 10) + '쪽 →</button>' : '') + '</div>';
  $$('[data-page]', view).forEach(b => b.onclick = () => { page = +b.dataset.page; T.save('tsc-p2-page', page); viewEx(); });
  $$('[data-step]', view).forEach(b => b.onclick = () => { page += +b.dataset.step; T.save('tsc-p2-page', page); viewEx(); scrollTo({top: 0}); });
  bindDone();
}

/* ===== 단어장 ===== */
let topic = T.load('tsc-p2-topic', 0), vmode = 'list', deck = [], dpos = 0;
function viewVocab(){
  const rows = D.v[topic][1], ids = rows.map((_, i) => 'v:' + topic + ':' + i);
  let h = progressCard(IDS.vocab, '단어 외움') +
    chips(D.v.map((g, t) => [t, g[0], prog.count(g[1].map((_, i) => 'v:' + t + ':' + i)) + '/' + g[1].length]), topic, 'data-topic') +
    '<div class="row"><span class="seg" id="vmode"><button type="button" data-v="list" aria-pressed="' + (vmode === 'list') + '">목록</button><button type="button" data-v="card" aria-pressed="' + (vmode === 'card') + '">카드 넘기기</button></span></div>';
  if (vmode === 'list') h += rows.map((r, i) => rowCard(r, ids[i], '', true)).join('');
  else {
    if (!deck.length || !deck.every(id => ids.includes(id))) { deck = ids.slice().sort(() => Math.random() - .5); dpos = 0; }
    if (dpos >= deck.length) h += '<div class="card center"><h3>한 바퀴 끝! 👏</h3><p class="muted">외운 단어 ' + prog.count(deck) + ' / ' + deck.length + '</p><button class="btn primary" type="button" id="again">다시 섞어서 시작</button></div>';
    else {
      const r = rows[+deck[dpos].split(':')[2]];
      h += '<div class="small muted" style="margin-top:10px">' + (dpos + 1) + ' / ' + deck.length + '</div><div class="progress" style="margin:6px 0"><i style="width:' + (dpos / deck.length * 100) + '%"></i></div>' +
        '<div class="flash" id="flash"><button class="inner" type="button" aria-label="카드 뒤집기"><div class="face"><div class="small muted">중국어로 말해 보세요</div><div class="big-ko">' + esc(r[0]) + '</div><div class="small muted">눌러서 뒤집기</div></div>' +
        '<div class="face back"><div class="say"><div class="line py" style="font-size:26px">' + esc(r[1]) + '</div><div class="line hg" style="font-size:20px">' + T.toneHTML(r[2], r[3]) + '</div></div><div class="small muted">' + esc(r[0]) + '</div></div></button></div>' +
        T.judgeBtns();
    }
  }
  view.innerHTML = h;
  $$('[data-topic]', view).forEach(b => b.onclick = () => { topic = +b.dataset.topic; T.save('tsc-p2-topic', topic); deck = []; viewVocab(); });
  $('#vmode').onclick = e => { const b = e.target.closest('button'); if (b) { vmode = b.dataset.v; deck = []; viewVocab(); } };
  const fl = $('#flash'); if (fl) fl.querySelector('.inner').onclick = () => fl.classList.toggle('flipped');
  const next = ok => { const id = deck[dpos]; T.setMark('p2', id, ok ? 'done' : 'wrong'); if (!ok) deck.push(id); dpos++; summary(); viewVocab(); };
  $('#yes') && ($('#yes').onclick = () => next(true));
  $('#no') && ($('#no').onclick = () => next(false));
  $('#again') && ($('#again').onclick = () => { deck = []; viewVocab(); });
  bindDone();
}

/* ===== 문장 패턴 ===== */
function viewPattern(){
  view.innerHTML = progressCard(IDS.pattern, '문장 외움') +
    '<h2>문장 패턴</h2><p class="small muted">먼저 질문을 말해 보고, 숫자나 장소를 바꿔 한 번 더 말해 보세요.</p>' +
    D.patterns.map((r, i) => rowCard(r, 'pt:' + i)).join('') +
    '<h2>응용문제 모아 보기</h2>' +
    D.app.map((r, i) => { const n = D.appNotes[r[0]]; const g = n && D.gloss[n[0]]; return rowCard(r, 'app:' + i, n ? (g ? g[1] + ' (' + g[0] + ') · ' : '') + n[1] : ''); }).join('');
  bindDone();
}

/* ===== 부록 ===== */
let apage = T.load('tsc-p2-apage', 0);
function viewAppendix(){
  const [a, b] = RANGES[apage];
  view.innerHTML = progressCard(IDS.appendix, '부록 문제 외움') +
    chips(RANGES.map(([x, y], i) => [i, x + '–' + y + '번', prog.count(IDS.appendix.slice(x - 1, y)) + '/' + (y - x + 1)]), apage, 'data-ap') +
    '<details class="card more" style="margin-top:4px"><summary>📷 ' + a + '–' + b + '번 원본 사진과 필기</summary><img class="photo" loading="lazy" alt="부록 ' + a + '–' + b + '번 원본" src="' + D.appendixPhotos[apage] + '"></details>' +
    D.appendix.slice(a - 1, b).map((x, i) => pairCard(x, 'ap:' + (a - 1 + i), '부록 ' + (a + i) + '번', D.hints[a + i] ? '<p class="small" style="margin:0 0 4px;color:var(--warn)">🖼 그림 단서 · ' + esc(D.hints[a + i]) + '</p>' : '')).join('') +
    '<div class="row end">' + (apage > 0 ? '<button class="btn" type="button" data-astep="-1">← 이전 범위</button>' : '') + (apage < RANGES.length - 1 ? '<button class="btn primary" type="button" data-astep="1">다음 범위 →</button>' : '') + '</div>';
  $$('[data-ap]', view).forEach(b => b.onclick = () => { apage = +b.dataset.ap; T.save('tsc-p2-apage', apage); viewAppendix(); });
  $$('[data-astep]', view).forEach(b => b.onclick = () => { apage += +b.dataset.astep; T.save('tsc-p2-apage', apage); viewAppendix(); scrollTo({top: 0}); });
  bindDone();
}

/* ===== 실전 퀴즈 ===== */
const CATS = [
  ['vocab', '단어', () => D.v.flatMap((g, t) => g[1].map((r, i) => ({id: 'v:' + t + ':' + i, row: r})))],
  ['ex', '교재 예제', () => D.ex.map((x, i) => ({id: 'ex:' + i, pair: x}))],
  ['app', '응용문제', () => D.app.map((r, i) => ({id: 'app:' + i, row: r}))],
  ['ap', '부록', () => D.appendix.map((x, i) => ({id: 'ap:' + i, pair: x}))],
];
const quiz = Object.assign({cats: ['ex', 'ap'], timed: true, onlyTodo: false}, T.load('tsc-p2-quiz', {}), {deck: [], pos: 0, running: false, cd: null});
const saveQuiz = () => T.save('tsc-p2-quiz', {cats: quiz.cats, timed: quiz.timed, onlyTodo: quiz.onlyTodo});
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function startQuiz(){
  let sets = CATS.filter(c => quiz.cats.includes(c[0])).map(c => shuffle(c[2]().filter(it => !quiz.onlyTodo || !prog.has(it.id))));
  const deck = [];
  while (deck.length < 10 && sets.some(s => s.length)) for (const s of shuffle(sets.filter(s => s.length))) if (deck.length < 10) deck.push(s.pop());
  quiz.deck = shuffle(deck); quiz.pos = 0; quiz.known = 0; quizStep();
}
function viewQuiz(){
  view.innerHTML = '<div class="card"><h3 style="margin-top:0">⏱ 실전 퀴즈 10문제</h3><p class="small muted">고른 유형을 골고루 섞어 출제해요. 타이머를 켜면 실제 시험처럼 <b>준비 3초 · 답변 6초</b>가 흘러요.</p>' +
    '<p class="small muted" style="margin:10px 0 4px">출제 범위</p><div class="row">' + CATS.map(([k, l]) => '<label class="check"><input type="checkbox" data-cat="' + k + '"' + (quiz.cats.includes(k) ? ' checked' : '') + '> ' + l + '</label>').join('') + '</div>' +
    '<p class="small muted" style="margin:12px 0 4px">방식</p><div class="row"><label class="check"><input type="checkbox" id="timed"' + (quiz.timed ? ' checked' : '') + '> 시험 타이머 (3초 + 6초)</label><label class="check"><input type="checkbox" id="todo"' + (quiz.onlyTodo ? ' checked' : '') + '> 아직 못 외운 것만</label></div>' +
    '<button class="btn primary big" type="button" id="start" style="width:100%;margin-top:14px"' + (quiz.cats.length ? '' : ' disabled') + '>10문제 시작</button></div>';
  view.onchange = e => {
    if (e.target.dataset.cat) quiz.cats = CATS.map(c => c[0]).filter(k => $('[data-cat="' + k + '"]').checked);
    if (e.target.id === 'timed') quiz.timed = e.target.checked;
    if (e.target.id === 'todo') quiz.onlyTodo = e.target.checked;
    saveQuiz(); $('#start').disabled = !quiz.cats.length;
  };
  $('#start').onclick = () => { view.onchange = null; startQuiz(); };
}
async function quizStep(){
  const it = quiz.deck[quiz.pos];
  if (!it) {
    quiz.running = false;
    view.innerHTML = '<div class="card center"><h3>' + (quiz.deck.length ? '10문제 끝! 👏' : '출제할 문제가 없어요') + '</h3>' + (quiz.deck.length ? '<p class="muted">‘알아요’ ' + quiz.known + ' / ' + quiz.deck.length + '</p>' : '<p class="muted">범위를 넓히거나 ‘아직 못 외운 것만’을 꺼 주세요.</p>') +
      '<div class="row" style="justify-content:center">' + (quiz.deck.length ? '<button class="btn" type="button" id="same">같은 문제 다시</button>' : '') + '<button class="btn primary" type="button" id="new">새 10문제</button><button class="btn ghost" type="button" id="setup">범위 바꾸기</button></div></div>';
    $('#same') && ($('#same').onclick = () => { quiz.pos = 0; quiz.known = 0; quizStep(); });
    $('#new').onclick = startQuiz; $('#setup').onclick = viewQuiz;
    return;
  }
  quiz.running = true;
  const n = quiz.deck.length, cat = CATS.find(c => it.id.startsWith(c[0] === 'vocab' ? 'v:' : c[0] + ':'))[1];
  const prompt = it.pair ? it.pair[0][0] : it.row[0];
  const answerHTML = it.pair ? '<p class="ko" style="margin:0">' + esc(it.pair[1][0]) + '</p><div class="reveal open">' + T.sayHTML(rowObj(it.pair[1]), {noExpand: true}) + '</div>' + studyNote(it.pair) : '<div class="reveal open">' + T.sayHTML(rowObj(it.row), {noExpand: true}) + '</div>';
  view.innerHTML = '<div class="card"><div class="card-head"><span class="badge">' + cat + '</span><span class="label">' + (quiz.pos + 1) + ' / ' + n + '</span><button class="btn ghost" type="button" id="quit">그만하기</button></div><div class="progress"><i style="width:' + (quiz.pos / n * 100) + '%"></i></div>' +
    '<p class="small muted" style="margin:14px 0 2px">' + (it.pair ? '질문 — 중국어로 듣고 답한다고 생각하고 답변을 말해 보세요' : '중국어로 말해 보세요') + '</p><p class="ko" style="font-size:20px;margin:0">' + esc(prompt) + '</p>' +
    (it.pair ? '<details class="more"><summary>질문 병음 보기</summary>' + '<div class="reveal open">' + T.sayHTML(rowObj(it.pair[0]), {noExpand: true}) + '</div></details>' : '') +
    '<div id="tm" class="center"></div><div id="ans"></div></div>';
  let stopped = false;
  $('#quit').onclick = () => { stopped = true; quiz.cd && quiz.cd.cancel(); quiz.running = false; viewQuiz(); };
  if (quiz.timed) {
    quiz.cd = T.countdown($('#tm'), 3, '준비', 'prep'); if (!(await quiz.cd) || stopped) return;
    quiz.cd = T.countdown($('#tm'), 6, '답변'); if (!(await quiz.cd) || stopped) return;
    $('#tm').innerHTML = '';
  } else {
    $('#tm').innerHTML = '<button class="btn primary big" type="button" id="show" style="margin-top:14px">정답 보기</button>';
    await new Promise(r => $('#show').onclick = r);
    $('#tm').innerHTML = '';
  }
  $('#ans').innerHTML = '<div style="margin-top:6px">' + (it.pair ? '<p class="small muted" style="margin:0">정답</p>' : '') + answerHTML + '</div>' +
    '<div style="margin-top:14px">' + T.judgeBtns() + '</div>';
  const next = ok => { T.setMark('p2', it.id, ok ? 'done' : 'wrong'); if (ok) quiz.known++; summary(); quiz.pos++; quizStep(); };
  $('#yes').onclick = () => next(true); $('#no').onclick = () => next(false);
}

/* ===== 탭 ===== */
const TABS = [['ex','교재 예제','📘'],['vocab','단어장','🔤'],['pattern','문장 패턴','🧩'],['appendix','부록','📝'],['quiz','실전','⏱']];
const VIEWS = {ex: viewEx, vocab: viewVocab, pattern: viewPattern, appendix: viewAppendix, quiz: viewQuiz};
let tab = T.load('tsc-p2-tab', 'ex'); if (!VIEWS[tab]) tab = 'ex';
function go(t){
  if (quiz.running) { quiz.cd && quiz.cd.cancel(); quiz.running = false; }
  view.onchange = null; tab = t; T.save('tsc-p2-tab', t);
  T.tabs($('#tabs'), TABS, t, go); VIEWS[t]();
}
view.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); scrollTo({top: 0}); } });
document.addEventListener('tsc:settings', () => { if (tab !== 'quiz') VIEWS[tab](); });
T.onMark = () => {
  summary();
  const el = $('#statcard'); if (el && lastProg) { const d = prog.count(lastProg[0]); el.querySelector('.stat b').textContent = d; el.querySelector('.progress i').style.width = (d / lastProg[0].length * 100) + '%'; }
};
/* 문장 속 단어 뜻: 단어 풀이·단어장으로 사전 만들기 */
Object.values(D.gloss).forEach(w => T.addLex({py: w[1], hg: w[2], parts: w[3], ko: w[0]}));
D.v.forEach(g => g[1].forEach(r => T.addLex({py: r[1], hg: r[2], parts: r[3], ko: r[0]})));
/* 단어 풀이에 없던 문장 속 단어 */
T.addLexList([
  ['wǒ','워','나'], ['nǐ','니','너'], ['nín','닌','당신 (높임말)'], ['zhèr','절','여기'], ['jiā','자','집'], ['hěn','헌','매우'], ['jìn','진','가깝다'], ['hái','하이','아직, 더'],
  ['tiàowǔ','탸오|우','춤추다'], ['bú shì','부 스','아니다'], ['xiězì','시에|쯔','글씨를 쓰다'], ['huàr','화얼','그림'], ['xǐ wǎn','시 완','설거지하다'],
