<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSC 단어장</title>
<meta name="description" content="TSC 교재 단어장 — 주제별 단어, ★ 3급 핵심 단어와 예문">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/app.js"></script>
<script src="../assets/words.js"></script>
<script src="data.js"></script>
<script src="measure.js"></script>
<script src="lexpick.js"></script>
</head>
<body class="has-bottom">
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">TSC 단어장</div>
    <h1>주제별 단어장</h1>
    <p>교재 단어를 주제별로 모았어요. 이름 끝에 <b>+</b>가 붙은 주제는 교재에 없지만 3급에 꼭 필요한 기초 단어예요. <b>★ 3급 핵심 단어</b>부터 외우고, 예문은 2·3·4부분 답변에 그대로 써 보세요.</p>
  </section>
  <nav class="tabs bottom" id="tabs" aria-label="단어장 메뉴"></nav>
  <section id="view" aria-live="polite"></section>
  <p class="foot">외운 표시는 이 기기 브라우저에만 저장돼요.</p>
</main>
<script>
const T = TSC, {esc, $, $$} = T, CATS = window.VOC;
T.topbar({title: '단어장', sub: 'TSC 중국어 말하기'});
T.save('tsc-last', {href: 'vocab/', name: '단어장'});
const prog = T.progress('voc');
const ALLW = CATS.flatMap(c => c.words.map(w => Object.assign(w, {cat: c})));
const STAR = ALLW.filter(w => w.star);
const st = Object.assign({cat: 'all', onlyStar: true, onlyWrong: false, mode: 'list'}, T.load('tsc-voc-view', {}));
const saveSt = () => T.save('tsc-voc-view', {cat: st.cat, onlyStar: st.onlyStar, mode: st.mode});
function summary(){ const s = T.load('tsc-summary', {}); s.voc = {done: prog.count(STAR.map(w => w.id)), total: STAR.length}; T.save('tsc-summary', s); }

/* 예문 속 단어 뜻: 단어장 단어 + 기본 단어 */
ALLW.forEach(w => T.addLex({py: w.py.replace(/\s*…\s*/g, ' ').replace(/\s+/g, ' ').trim(), hg: w.hg, parts: w.parts, ko: w.ko}));
T.addLexList(window.VOC_FUNC);
T.addLexList(window.MW.lex);
T.lexPick = window.VOC_LEXPICK;
T.exampleSource = () => [...STAR.flatMap(w => w.ex), ...window.MW.words.flatMap(w => w.ph), ...window.MW.sents];
const view = $('#view');

/* ===== 목록 ===== */
const exRow = e => '<div class="vexi"><p class="small" style="margin:0;font-weight:650">' + T.koHTML(e) + '</p><div class="reveal open" style="margin-top:4px">' + T.sayHTML(e) + '</div></div>';
function pool(){
  return ALLW.filter(w => (st.cat === 'all' || w.cat.id === st.cat) && (!st.onlyStar || w.star) && (!st.onlyWrong || T.markState('voc', w.id) === 'wrong'));
}
function wordRow(w){
  const s = T.markState('voc', w.id);
  return '<div class="vrow' + (s ? ' ' + s : '') + '" data-id="' + w.id + '">' +
    '<div class="vw" data-w="' + esc(JSON.stringify({py: w.py, hg: w.hg, parts: w.parts, ko: w.ko})) + '" role="button" tabindex="0">' +
      '<div class="say"><div class="line py">' + (w.star ? '<span class="star" aria-label="핵심">★</span>' : '') + esc(T.pinyinWithExpanded(w.py)) + '</div>' +
      '<div class="line hg">' + T.toneHTML(w.hg, w.parts) + '</div></div></div>' +
    '<div class="vk">' + esc(w.ko) + (w.note ? '<small>💡 ' + esc(w.note) + '</small>' : '') +
      (w.ex ? '<button class="vexbtn" type="button" data-ex aria-expanded="false">예문 ' + w.ex.length + '</button>' : '') + '</div>' +
    T.markBtns('voc', w.id) +
    (w.ex ? '<div class="vex" hidden>' + w.ex.map(exRow).join('') + '</div>' : '') +
    '</div>';
}
function wordList(list){
  const groups = st.cat === 'all' ? CATS.map(c => [c, list.filter(w => w.cat === c)]).filter(g => g[1].length) : [[list[0].cat, list]];
  return groups.map(([c, ws]) => '<section class="card vlist">' + (st.cat === 'all' ? '<h3 class="vcat">' + esc(c.name) + '<span>' + ws.length + '</span></h3>' : '') + ws.map(wordRow).join('') + '</section>').join('');
}
function controls(){
  const cnt = c => ALLW.filter(w => (c === 'all' || w.cat.id === c) && (!st.onlyStar || w.star)).length;
  const starDone = prog.count(STAR.map(w => w.id));
  const wrongN = ALLW.filter(w => T.markState('voc', w.id) === 'wrong').length;
  return '<div class="card" id="statcard"><div class="row"><div class="stat"><b>' + starDone + '</b><span class="muted">/ ' + STAR.length + ' ★ 핵심 단어 외움</span></div></div>' +
    '<div class="progress" style="margin-top:10px"><i style="width:' + (starDone / STAR.length * 100) + '%"></i></div>' +
    '<div class="row" style="margin-top:10px"><button class="chip" type="button" data-star aria-pressed="' + st.onlyStar + '">★ 핵심만</button>' + T.wrongToggle(st.onlyWrong, wrongN) +
    '<span class="spacer"></span><span class="seg" id="vmode"><button type="button" data-v="list" aria-pressed="' + (st.mode === 'list') + '">목록</button><button type="button" data-v="card" aria-pressed="' + (st.mode === 'card') + '">카드</button></span></div></div>' +
    '<div class="chips">' + [['all', '전체'], ...CATS.map(c => [c.id, c.name])].map(([id, n]) => '<button class="chip" type="button" data-cat="' + id + '" aria-pressed="' + (st.cat === id) + '">' + esc(n) + '<span class="n">' + cnt(id) + '</span></button>').join('') + '</div>';
}
let deck = [], dpos = 0;
function render(){
  if (st.mode === 'mw') return renderMW();
  const list = pool();
  let h = controls();
  if (!list.length) h += st.onlyWrong ? T.emptyWrong : '<div class="card empty">이 주제에는 ★ 핵심 단어가 없어요. ‘★ 핵심만’을 끄면 전체 단어가 보여요.</div>';
  else if (st.mode === 'list') h += wordList(list) + '<p class="small muted">단어를 누르면 상세, 예문 버튼을 누르면 예문이 열려요.</p>';
  else {
    const ids = list.map(w => w.id);
    if (!deck.length || !deck.every(id => ids.includes(id))) { deck = ids.slice().sort(() => Math.random() - .5); dpos = 0; }
    if (dpos >= deck.length) h += '<div class="card center"><h3>한 바퀴 끝! 👏</h3><p class="muted">외운 단어 ' + prog.count(deck) + ' / ' + deck.length + '</p><button class="btn primary" type="button" id="again">다시 섞어서 시작</button></div>';
    else {
      const w = ALLW.find(x => x.id === deck[dpos]);
      h += '<div class="small muted">' + (dpos + 1) + ' / ' + deck.length + ' · ' + esc(w.cat.name) + '</div><div class="progress" style="margin:6px 0"><i style="width:' + (dpos / deck.length * 100) + '%"></i></div>' +
        '<div class="flash" id="flash"><button class="inner" type="button" aria-label="카드 뒤집기"><div class="face"><div class="small muted">중국어로 말해 보세요</div><div class="big-ko">' + esc(w.ko) + '</div><div class="small muted">눌러서 뒤집기</div></div>' +
        '<div class="face back"><div class="say"><div class="line py" style="font-size:28px">' + esc(T.pinyinWithExpanded(w.py)) + '</div><div class="line hg" style="font-size:20px">' + T.toneHTML(w.hg, w.parts) + '</div></div><div class="small muted">' + esc(w.ko) + '</div></div></button></div>' +
        T.judgeBtns() +
        (w.ex ? '<div class="card" style="margin-top:14px"><p class="small muted" style="margin:0">예문</p>' + w.ex.map(e => '<div style="margin-top:8px"><p class="small" style="margin:0;font-weight:650">' + esc(e.ko) + '</p>' + T.revealHTML(T.sayHTML(e)) + '</div>').join('') + '</div>' : '');
    }
  }
  view.innerHTML = h;
  const fl = $('#flash'); if (fl) fl.querySelector('.inner').onclick = () => fl.classList.toggle('flipped');
  const next = ok => { const id = deck[dpos]; T.setMark('voc', id, ok ? 'done' : 'wrong'); if (!ok) deck.push(id); dpos++; summary(); render(); };
  $('#yes') && ($('#yes').onclick = () => next(true));
  $('#no') && ($('#no').onclick = () => next(false));
  $('#again') && ($('#again').onclick = () => { deck = []; render(); });
}

/* ===== 양사 탭 (measure.js) ===== */
const MW = window.MW;
const mwSt = Object.assign({grade: 'S', sub: 'list'}, T.load('tsc-voc-mw', {}));
const saveMw = () => T.save('tsc-voc-mw', mwSt);
const GRADE = {S: 'S등급 · 꼭 외울 16개', A: 'A등급 · 3급 보완·4급 대비', B: 'B등급 · 여유 있을 때'};
let mdeck = [], mpos = 0;
const mwPool = () => MW.words.filter(w => mwSt.grade === 'all' || w.grade === mwSt.grade);
function mwRow(w, i){
  const s = T.markState('mw', w.id);
  return '<div class="vrow' + (s ? ' ' + s : '') + '" data-id="' + w.id + '">' +
    '<div class="vw" data-w="' + esc(JSON.stringify({py: w.py, hg: w.hg, parts: w.parts, ko: '양사: ' + w.ko})) + '" role="button" tabindex="0">' +
      '<div class="say"><div class="line py"><span class="star" style="color:var(--muted)">' + (i + 1) + '</span>' + esc(T.pinyinWithExpanded(w.py)) + '</div><div class="line hg">' + T.toneHTML(w.hg, w.parts) + '</div></div></div>' +
    '<div class="vk">' + esc(w.ko) + '<small>' + esc(w.target) + '</small>' + '<button class="vexbtn" type="button" data-ex aria-expanded="false">표현 ' + w.ph.length + '</button></div>' +
    T.markBtns('mw', w.id) +
    '<div class="vex" hidden>' + (w.note ? '<p class="small muted" style="margin:6px 0 0">💡 ' + esc(w.note) + '</p>' : '') + w.ph.map(exRow).join('') + '</div></div>';
}
function renderMW(){
  const sub = '<div class="row" style="margin-top:14px"><span class="seg" id="mwsub">' + [['list', '양사 목록'], ['rule', '규칙·문장'], ['test', '암기 테스트']].map(([k, n]) => '<button type="button" data-sub="' + k + '" aria-pressed="' + (mwSt.sub === k) + '">' + n + '</button>').join('') + '</span></div>';
  const chips = '<div class="chips">' + [['S', 'S등급'], ['A', 'A등급'], ['B', 'B등급'], ['all', '전체']].map(([g, n]) => '<button class="chip" type="button" data-grade="' + g + '" aria-pressed="' + (mwSt.grade === g) + '">' + n + '<span class="n">' + MW.words.filter(w => g === 'all' || w.grade === g).length + '</span></button>').join('') + '</div>';
  let h = sub;
  if (mwSt.sub === 'list') {
    const done = MW.words.filter(w => T.markState('mw', w.id) === 'done').length;
    h += '<div class="card" style="margin-top:10px"><div class="stat"><b>' + done + '</b><span class="muted">/ ' + MW.words.length + ' 양사 외움</span></div>' +
      '<p class="small muted" style="margin:8px 0 0">양사는 명사와 한 덩어리로 외워요: <b>yì bēi kāfēi</b>(커피 한 잔). 2부분은 답변 시간이 6초라 떠올릴 틈이 없어요.</p></div>' + chips;
    const groups = mwSt.grade === 'all' ? ['S', 'A', 'B'] : [mwSt.grade];
    h += groups.map(g => '<section class="card vlist"><h3 class="vcat">' + GRADE[g] + '</h3>' + MW.words.filter(w => w.grade === g).map(w => mwRow(w, MW.words.filter(x => x.grade === g).indexOf(w))).join('') + '</section>').join('');
    h += '<p class="small muted">양사를 누르면 상세, ‘표현’을 누르면 결합 표현이 열려요. S·A·B 등급은 시험 유형과 회화 활용도를 기준으로 정한 학습 순서예요(공식 출제 통계는 없어요).</p>';
  } else if (mwSt.sub === 'rule') {
    const tip = (t, b) => '<div class="card"><h3 style="margin:0 0 8px">' + t + '</h3>' + b + '</div>';
    h += tip('어순: 숫자 + 양사 + 명사', '<p style="margin:0">한국어는 ‘커피 한 잔’, 중국어는 ‘한 잔 커피’ 순서예요.</p><p class="small muted" style="margin:6px 0 0">yì bēi kāfēi 커피 한 잔 · zhè běn shū 이 책 · nà běn shū 저 책 · nǎ běn shū 어느 책 · jǐ běn shū 책 몇 권</p>') +
      tip('2는 èr이 아니라 liǎng', '<p class="small muted" style="margin:0">liǎng ge rén 두 사람 · liǎng běn shū 책 두 권 · liǎng bēi kāfēi 커피 두 잔 · liǎng kǒu rén 가족 두 명</p>') +
      tip('yī(1)의 성조 변화', '<p style="margin:0">1·2·3성 앞에서는 <b>yì</b>, 4성 앞에서는 <b>yí</b>.</p><p class="small muted" style="margin:6px 0 0">yì bēi(1성) · yì píng(2성) · yì běn(3성) · yí jiàn(4성) · yí ge — ge는 원래 4성(gè)이라 yí ge.</p>') +
      tip('묶어서 외우기', '<div class="small" style="display:grid;gap:6px">' + MW.groups.map(([m, t]) => '<div><b style="color:var(--brand-text)">' + esc(m) + '</b> — ' + esc(t) + '</div>').join('') + '</div>') +
      '<h2 style="margin-top:24px">실전 문장</h2>' + MW.sents.map(e => '<div class="card" style="padding:12px 14px;margin:8px 0"><span class="badge">' + esc(e.part) + '</span><p class="ko" style="margin:6px 0 0">' + esc(e.ko) + '</p>' + T.revealHTML(T.sayHTML(e)) + '</div>').join('');
  } else {
    h += chips;
    const ids = mwPool().flatMap(w => w.ph.map((_, j) => w.id + ':' + j));
    if (!mdeck.length || !mdeck.every(id => ids.includes(id))) { mdeck = ids.slice().sort(() => Math.random() - .5); mpos = 0; }
    if (mpos >= mdeck.length) h += '<div class="card center"><h3>한 바퀴 끝! 👏</h3><button class="btn primary" type="button" id="mwagain">다시 섞어서 시작</button></div>';
    else {
      const [a, b, j] = mdeck[mpos].split(':'); const w = MW.words.find(x => x.id === a + ':' + b), e = w.ph[+j];
      h += '<div class="small muted" style="margin-top:6px">' + (mpos + 1) + ' / ' + mdeck.length + '</div><div class="progress" style="margin:6px 0"><i style="width:' + (mpos / mdeck.length * 100) + '%"></i></div>' +
        '<div class="flash" id="flash"><button class="inner" type="button" aria-label="카드 뒤집기"><div class="face"><div class="small muted">양사를 넣어 중국어로 말해 보세요</div><div class="big-ko">' + esc(e.ko) + '</div><div class="small muted">눌러서 뒤집기</div></div>' +
        '<div class="face back">' + T.sayHTML(e) + '<div class="small muted" style="margin-top:6px">양사 ' + esc(w.py) + ' · ' + esc(w.ko) + '</div></div></button></div>' + T.judgeBtns();
    }
  }
  view.innerHTML = h;
  const fl = $('#flash'); if (fl) fl.querySelector('.inner').onclick = e => { if (e.target.closest('.tw')) return; fl.classList.toggle('flipped'); };
  const next = ok => { T.setMark('mwt', mdeck[mpos], ok ? 'done' : 'wrong'); if (!ok) mdeck.push(mdeck[mpos]); mpos++; renderMW(); };
  $('#yes') && ($('#yes').onclick = () => next(true));
  $('#no') && ($('#no').onclick = () => next(false));
  $('#mwagain') && ($('#mwagain').onclick = () => { mdeck = []; renderMW(); });
}
view.addEventListener('click', e => {
  const sb = e.target.closest('[data-sub]'); if (sb) { mwSt.sub = sb.dataset.sub; saveMw(); renderMW(); return; }
  const gb = e.target.closest('[data-grade]'); if (gb) { mwSt.grade = gb.dataset.grade; mdeck = []; saveMw(); renderMW(); return; }
  const xb = e.target.closest('[data-ex]'); if (xb) { const box = xb.closest('.vrow').querySelector('.vex'); box.hidden = !box.hidden; xb.setAttribute('aria-expanded', !box.hidden); return; }
  const c = e.target.closest('[data-cat]'); if (c) { st.cat = c.dataset.cat; deck = []; saveSt(); render(); return; }
  if (e.target.closest('[data-star]')) { st.onlyStar = !st.onlyStar; deck = []; saveSt(); render(); return; }
  if (e.target.closest('[data-wrongonly]')) { st.onlyWrong = !st.onlyWrong; deck = []; render(); return; }
  const m = e.target.closest('#vmode button'); if (m) { go(m.dataset.v); }
});
T.onMark = () => { summary(); const el = $('#statcard'); if (el) { const d = prog.count(STAR.map(w => w.id)); el.querySelector('.stat b').textContent = d; el.querySelector('.progress i').style.width = (d / STAR.length * 100) + '%'; } };

/* 아래 탭: 목록 / 카드 넘기기 */
const TABS = [['list', '목록', '📋'], ['card', '카드 넘기기', '🃏'], ['mw', '양사', '🔢']];
function go(t){
  st.mode = t; deck = []; saveSt();
  T.tabs($('#tabs'), TABS, t, go); render(); scrollTo({top: 0});
}
T.tabs($('#tabs'), TABS, st.mode, go);
summary();
render();
</script>
</body>
</html>
