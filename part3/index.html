<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSC 3부분 빠르게 답하기</title>
<meta name="description" content="TSC 3부분 빠르게 답하기 — 제안과 부탁에 바로 답하기, 패턴, 단어, 실전 연습">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/app.js"></script>
<script src="../assets/words.js"></script>
</head>
<body class="has-bottom">
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">TSC PART 3</div>
    <h1>3부분 빠르게 답하기</h1>
    <p>5문항 · 준비 2초 · 답변 15초. 상대 말에 <b>반응 한마디 + 구체적인 한두 문장</b>으로 답해요. (교재 23쪽 · 제안과 부탁)</p>
  </section>
  <nav class="tabs bottom" id="tabs" aria-label="학습 메뉴"></nav>
  <section id="view" aria-live="polite"></section>
  <p class="foot">진도는 이 기기 브라우저에만 남아요.</p>
</main>
<script>
const T = TSC, {esc, $, $$} = T;
T.topbar({title: '3부분 · 빠르게 답하기', sub: 'TSC 중국어 말하기'});
T.save('tsc-last', {href: 'part3/', name: '3부분 빠르게 답하기'});

/* ===== 단어 [한자, 병음, 한글, 성조, 뜻] =====
   한글 b·d·g·j·z·zh 된소리 여부는 TSC.toneHTML이 성조에 맞춰 자동으로 바꿔요. */
const W = {
  ni:['你','nǐ','니',[3],'너'], wo:['我','wǒ','워',[3],'나'],
  bang:['帮','bāng','방',[1],'돕다'], zhunbei:['准备','zhǔnbèi','주언|베이',[3,4],'준비하다'], huiyi:['会议','huìyì','후에이|이',[4,4],'회의'], ziliao:['资料','zīliào','즈|랴오',[1,4],'자료'],
  ba:['吧','ba','바',[0],'~하자, ~해 (제안·부탁)'], haode:['好的','hǎo de','하오 더',[3,0],'좋아, 알겠어'], mei:['没','méi','메이',[2],'없다'], wenti:['问题','wèntí','원|티',[4,2],'문제'],
  haoC:['好','hǎo','하오',[3],'(동사 뒤) 다 ~하다'], wan:['完','wán','완',[2],'(동사 뒤) 다 ~하다, 끝내다'], shang4:['上','shàng','샹',[4],'~위'], yihou:['以后','yǐhòu','이|허우',[3,4],'~한 뒤에'], ba3:['把','bǎ','바',[3],'~을 (목적어를 앞으로)'], fang:['放','fàng','팡',[4],'놓다'],
  zai:['在','zài','짜이',[4],'~에 (있다), ~하는 중'], de:['的','de','더',[0],'~의'], zhuozi:['桌子','zhuōzi','줘|즈',[1,0],'책상'], shang:['上','shang','샹',[0],'~위'],
  yao:['要','yào','야오',[4],'~해야 한다'], neng:['能','néng','넝',[2],'~할 수 있다'], fanyi:['翻译','fānyì','판|이',[1,4],'번역하다'], ma:['吗','ma','마',[0],'~니? (의문)'],
  feichang:['非常','fēicháng','페이|창',[1,2],'매우'], baoqian:['抱歉','bàoqiàn','바오|쳰',[4,4],'미안하다'], you:['有','yǒu','요우',[3],'있다'], hen:['很','hěn','헌',[3],'매우'], duo:['多','duō','둬',[1],'많다'], gongzuo:['工作','gōngzuò','궁|쭤',[1,4],'일'],
  bu:['不','bù','부',[4],'~하지 않다'], zai2:['再','zài','짜이',[4],'또, 다시'], wenwen:['问问','wènwen','원|원',[4,0],'한번 물어보다'], bieren:['别人','biérén','비에|런',[2,2],'다른 사람'],
  zhidao:['知道','zhīdào','즈|다오',[1,4],'알다'], jintian:['今天','jīntiān','진|톈',[1,1],'오늘'], baozhi:['报纸','bàozhǐ','바오|즈',[4,3],'신문'], nar:['哪儿','nǎr','날',[3],'어디'],
  zhaozhao:['找找','zhǎozhao','자오|자오',[3,0],'한번 찾아보다'], kan:['看','kàn','칸',[4],'보다'],
  mingtian:['明天','míngtiān','밍|톈',[2,1],'내일'], yiqi:['一起','yìqǐ','이|치',[4,3],'같이'], da:['打','dǎ','다',[3],'(공놀이를) 하다'], wangqiu:['网球','wǎngqiú','왕|치오우',[3,2],'테니스'], zenmeyang:['怎么样','zěnmeyàng','전|머|양',[3,0,4],'어때?'],
  hao:['好','hǎo','하오',[3],'좋다'], zhuyi:['主意','zhǔyi','주|이',[3,0],'생각, 아이디어'],
  xiawu:['下午','xiàwǔ','샤|우',[4,3],'오후'], liang:['两','liǎng','량',[3],'둘 (2시의 2)'], dian:['点','diǎn','뎬',[3],'~시'], yundongchang:['运动场','yùndòngchǎng','윈|둥|창',[4,4,3],'운동장'], menkou:['门口','ménkǒu','먼|커우',[2,3],'입구'], jian:['见','jiàn','젠',[4],'만나다'],
  bujianbusan:['不见不散','bú jiàn bú sàn','부 젠 부 싼',[2,4,2,4],'꼭 만나 (만날 때까지 기다릴게)'],
  zhao:['找','zhǎo','자오',[3],'찾다'], shenme:['什么','shénme','선|머',[2,0],'무엇'], yusan:['雨伞','yǔsǎn','위|싼',[3,3],'우산'],
  tianqi:['天气','tiānqì','톈|치',[1,4],'날씨'], yubao:['预报','yùbào','위|바오',[4,4],'예보'], shuo:['说','shuō','숴',[1],'말하다'], hui:['会','huì','후에이',[4],'~할 것이다'], xiayu:['下雨','xiàyǔ','샤|위',[4,3],'비가 오다'],
  kanjian:['看见','kànjiàn','칸|젠',[4,4],'보다 (눈에 띄다)'], le:['了','le','러',[0],'~했다 (완료)'],
  duibuqi:['对不起','duìbuqǐ','두에이|부|치',[4,0,3],'미안해'], mang:['忙','máng','망',[2],'바쁘다'], a:['啊','a','아',[0],'(말끝 어기)'], ji:['几','jǐ','지',[3],'몇'], kankan:['看看','kànkan','칸|칸',[4,0],'한번 보다'],
};
/* S('한국어', '단어키', ..., '，', '/', ...) */
const S = (ko, ...keys) => { const s = T.sentence(keys.map(k => W[k] || k), ko); s.words = keys.filter(k => W[k]); return s; };

/* ===== 문항 (교재 23쪽) ===== */
const ITEMS = [
  {id:'q1', title:'회의 자료 준비를 부탁받았을 때',
   q:S('회의 자료 준비 좀 도와줘.', 'ni', 'bang', 'wo', '/', 'zhunbei', 'huiyi', 'ziliao', 'ba', '。'),
   a:[S('좋아, 문제없어.', 'haode', '，', 'mei', 'wenti', '。'),
      S('준비가 끝나면 자료를 책상 위에 놓아둘게.', 'zhunbei', 'wan', 'yihou', '，', 'wo', 'ba3', 'ziliao', '/', 'fang', 'zai', 'zhuozi', 'shang4', 'ba', '。')],
   alt:[{s:S('다 준비하면 자료를 네 책상 위에 놓아둘게.', 'zhunbei', 'haoC', 'yihou', '，', 'wo', 'ba3', 'ziliao', '/', 'fang', 'zai', 'ni', 'de', 'zhuozi', 'shang', '。'),
         why:'‘다 준비되면’은 회화에서 wán보다 hǎo를 더 자주 써요. nǐ de(네)를 넣으면 어디에 둘지 더 분명해요. 명사 뒤 shang은 가볍게(경성) 읽어도 돼요.'}],
   note:'bāng + 사람 + 동작 = ‘(누가) ~하는 것을 돕다’. 동작 뒤 wán은 ‘다 ~하다(끝내다)’, yǐhòu는 ‘~한 뒤에’. bǎ + 물건 + fàng zài + 장소 = ‘~을 …에 놓다’.'},
  {id:'q2', title:'번역 부탁을 정중하게 거절할 때',
   q:S('회의 자료를 준비해야 하는데, 번역 좀 도와줄 수 있어?', 'wo', 'yao', 'zhunbei', 'huiyi', 'ziliao', '，', 'ni', 'neng', 'bang', 'wo', 'fanyi', 'ma', '？'),
   a:[S('정말 미안해. 일이 많아서 도와줄 수가 없어.', 'feichang', 'baoqian', '，', 'wo', 'you', 'hen', 'duo', 'gongzuo', '，', 'bu', 'neng', 'bang', 'ni', '。'),
      S('다른 사람에게 한번 물어봐.', 'ni', 'zai2', 'wenwen', 'bieren', 'ba', '。')],
   note:'yào는 여기서 ‘~해야 한다’, néng … ma?는 ‘~할 수 있어?’. 거절은 ‘사과 + 이유 + bù néng …’ 순서. wènwen처럼 동사를 겹치면 ‘한번 ~해 보다’이고, 뒤 음절은 가볍게(경성) 읽어요.'},
  {id:'q3', title:'오늘 신문을 함께 찾을 때',
   q:S('오늘 신문이 어디 있는지 알아?', 'ni', 'zhidao', '/', 'jintian', 'de', 'baozhi', 'zai', 'nar', 'ma', '？'),
   a:[S('모르겠어. 내가 같이 찾아볼게.', 'bu', 'zhidao', '，', 'wo', 'bang', 'ni', 'zhaozhao', 'ba', '。'),
      S('봐, 신문이 책상 위에 있어.', 'ni', 'kan', '，', 'baozhi', 'zai', 'zhuozi', 'shang', '。')],
   note:'nǐ zhīdào + 궁금한 내용 + ma? = ‘~인지 알아?’. 대답은 zhīdào / bù zhīdào로 시작해요. zhǎozhao는 ‘한번 찾아보다’. 회화에서는 zhīdào의 뒤 음절을 가볍게 zhīdao로도 읽어요.'},
  {id:'q4', title:'테니스 약속을 잡을 때',
   q:S('내일 같이 테니스 치는 게 어때?', 'mingtian', 'yiqi', 'da', 'wangqiu', '/', 'zenmeyang', '？'),
   a:[S('좋은 생각이야!', 'hao', 'zhuyi', '！'),
      S('내일 오후 두 시에 운동장 입구에서 만나자. 꼭 만나!', 'mingtian', 'xiawu', 'liang', 'dian', '/', 'zai', 'yundongchang', 'menkou', '/', 'jian', 'ba', '，', 'bujianbusan', '！')],
   note:'yìqǐ + 동작 + zěnmeyàng? = ‘같이 ~하는 게 어때?’. 약속은 시간 → zài + 장소 → jiàn ba 순서. 2시는 èr이 아니라 liǎng. bú jiàn bú sàn은 ‘만날 때까지 기다릴게(꼭 만나)’. hǎo zhǔyi의 zhǔyi는 회화에서 zhúyi로도 읽어요.'},
  {id:'q5', title:'우산을 찾으며 되물을 때',
   q:S('뭘 찾고 있어?', 'ni', 'zai', 'zhao', 'shenme', '？'),
   a:[S('우산을 찾고 있어. 일기예보에서 오늘 비가 온다고 했어.', 'wo', 'zai', 'zhao', 'yusan', '。', 'tianqi', 'yubao', 'shuo', '，', 'jintian', 'xiayu', '。'),
      S('우산 봤어?', 'ni', 'kanjian', 'yusan', 'le', 'ma', '？')],
   alt:[{s:S('우산을 찾고 있어. 일기예보에서 오늘 비가 올 거래.', 'wo', 'zai', 'zhao', 'yusan', '。', 'tianqi', 'yubao', 'shuo', '，', 'jintian', 'hui', 'xiayu', '。'),
         why:'앞으로 올 비라서 huì(~할 것이다)를 넣으면 뜻이 더 정확해요.'},
        {s:S('내 우산 봤어?', 'ni', 'kanjian', '/', 'wo', 'de', 'yusan', 'le', 'ma', '？'),
         why:'내 우산을 찾는 상황이라 wǒ de(내)를 넣으면 더 자연스러워요.'}],
   note:'zài + 동작 = ‘~하는 중’. kànjiàn … le ma? = ‘~ 봤어?’ — le는 목적어 뒤, ma 앞.'},
];

/* ===== 패턴 ===== */
const NEW = {
  refuse:S('미안해, 오늘 바빠서 도와줄 수 없어.', 'duibuqi', '，', 'wo', 'jintian', 'hen', 'mang', '，', 'bu', 'neng', 'bang', 'ni', '。'),
  when:S('좋아, 몇 시에 만나?', 'hao', 'a', '，', 'ji', 'dian', 'jian', '？'),
  look:S('좀 봐 줄 수 있어?', 'ni', 'neng', 'bang', 'wo', 'kankan', 'ma', '？'),
};
const it = i => ITEMS[i];
const PATTERNS = [
  {t:'부탁하기', f:'nǐ (néng) bāng wǒ + 동작 + ba / ma?', d:'bāng 뒤에 ‘누구를’, 그다음 ‘무엇을’. ba는 부드러운 부탁, néng … ma?는 ‘~해 줄 수 있어?’', ex:[it(0).q, NEW.look]},
  {t:'받아들이기', f:'hǎo de, méi wèntí. / hǎo zhǔyi! / hǎo a', d:'부탁에는 hǎo de, méi wèntí, 제안에는 hǎo zhǔyi · hǎo a로 바로 반응하고, 이어서 구체적인 말을 덧붙여요.', ex:[it(0).a[0], it(3).a[0], NEW.when]},
  {t:'거절하기', f:'duìbuqǐ / fēicháng bàoqiàn + 이유 + bù néng …', d:'사과 → 이유 → bù néng 순서. 이유는 hěn máng(바쁘다), gōngzuò hěn duō(일이 많다)처럼 짧게.', ex:[it(1).a[0], NEW.refuse], tag:'추가'},
  {t:'한번 ~해 보다', f:'동사 겹치기: wènwen · zhǎozhao · kànkan', d:'한 글자 동사를 두 번 쓰면 ‘한번 가볍게 ~해 보다’. 두 번째 음절은 경성으로 가볍게.', ex:[it(1).a[1], it(2).a[0], NEW.look]},
  {t:'제안하기', f:'(시간) + yìqǐ + 동작 + zěnmeyàng?', d:'‘같이 ~하는 게 어때?’ yī는 3성 앞이라 yì로 읽어요.', ex:[it(3).q]},
  {t:'약속 정하기', f:'시간 + zài + 장소 + jiàn ba', d:'중국어는 시간 → 장소 → 동작 순서. 2시 = liǎng diǎn.', ex:[it(3).a[1]]},
  {t:'~하는 중', f:'zài + 동작', d:'지금 하고 있는 일을 말할 때. Nǐ zài zhǎo shénme? → Wǒ zài zhǎo …', ex:[it(4).q, it(4).a[0]]},
  {t:'~을 …에 놓다', f:'bǎ + 물건 + fàng zài + 장소', d:'물건을 어디에 두는지 말할 때 쓰는 bǎ 문장.', ex:[it(0).a[1]]},
  {t:'~인지 알아?', f:'nǐ zhīdào + 궁금한 내용 + ma?', d:'대답은 zhīdào / bù zhīdào로 시작해요.', ex:[it(2).q, it(2).a[0]]},
  {t:'~했어?', f:'동작 + 목적어 + le ma?', d:'le는 목적어 뒤, ma 바로 앞.', ex:[it(4).a[1]]},
  {t:'앞으로 ~할 거야', f:'huì + 동작', d:'날씨·예정처럼 앞으로 일어날 일. jīntiān huì xiàyǔ = 오늘 비가 올 거래.', ex:[it(4).alt[0].s], tag:'추가'},
];

const prog = T.progress('p3'), wprog = T.progress('p3w');
const WORDS = Object.entries(W).filter(([k]) => !['haoC'].includes(k));
function summary(){ const s = T.load('tsc-summary', {}); s.p3 = {done: prog.count(ITEMS.map(x => x.id)) + wprog.count(WORDS.map(x => 'w:' + x[0])), total: ITEMS.length + WORDS.length}; T.save('tsc-summary', s); }
const view = $('#view');

/* ===== 조각 ===== */
const sayBlock = (s, label, open) => '<p class="small muted" style="margin:12px 0 0">' + label + '</p><p class="ko" style="margin:0">' + esc(s.ko) + '</p>' + T.revealHTML(T.sayHTML(s), open);
/* ===== 학습 ===== */
let onlyWrong = false, wordsWrong = false;
function viewLearn(){
  const done = prog.count(ITEMS.map(x => x.id));
  let h = '<div class="card" id="statcard"><div class="row"><div class="stat"><b>' + done + '</b><span class="muted">/ ' + ITEMS.length + '문항 외움</span></div><span class="spacer"></span><button class="btn soft" type="button" data-go="exam">⏱ 실전 연습</button></div><div class="progress" style="margin-top:10px"><i style="width:' + (done / ITEMS.length * 100) + '%"></i></div>' +
    '<!--wrong--><div class="tip" style="background:var(--brand-soft)"><b style="color:var(--brand-text)">답변 공식</b><span>① 반응 한마디(hǎo de / duìbuqǐ / bù zhīdào) + ② 구체적인 정보 한두 문장(시간·장소·이유). 15초면 두 문장이 딱 좋아요.</span></div></div>';
  const wrongN = ITEMS.filter(x => T.markState('p3', x.id) === 'wrong').length;
  h = h.replace('<!--wrong-->', '<div class="row" style="margin-top:10px">' + T.wrongToggle(onlyWrong, wrongN) + '</div>');
  const list = onlyWrong ? ITEMS.filter(x => T.markState('p3', x.id) === 'wrong') : ITEMS;
  if (!list.length) h += T.emptyWrong;
  list.forEach(x => { const i = ITEMS.indexOf(x);
    const on = prog.has(x.id);
    h += '<article class="card' + (on ? ' done' : '') + '" data-q="' + x.id + '"><div class="card-head"><span class="badge">문항 ' + (i + 1) + '</span><span class="label">' + esc(x.title) + '</span>' + T.markBtns('p3', x.id) + '</div>' +
      '<p class="small muted" style="margin:0">질문 — 중국어로 말해 보세요</p><p class="ko" style="margin:0">' + esc(x.q.ko) + '</p>' + T.revealHTML(T.sayHTML(x.q)) +
      sayBlock(x.a[0], '답변 ① 반응') + sayBlock(x.a[1], '답변 ② 이어서') +
      '<div class="tip"><b>TIP</b><span>' + esc(x.note) + '</span></div>' +
      (x.alt ? '<details class="more"><summary>더 자연스러운 표현 (추천)</summary><p class="small muted" style="margin:6px 0 0">교재 문장이 기본이에요. 아래는 회화에서 더 자연스럽게 쓰는 말이에요.</p>' + x.alt.map(a => '<div style="margin-top:10px"><p class="ko" style="margin:0">' + esc(a.s.ko) + '</p><div class="reveal open" style="margin-top:4px">' + T.sayHTML(a.s) + '</div><p class="small muted" style="margin:4px 0 0">💡 ' + esc(a.why) + '</p></div>').join('') + '</details>' : '') +
      (() => { const ks = [...new Set([x.q, ...x.a].flatMap(s => s.words))]; return '<details class="more"><summary>단어 (' + ks.length + ')</summary><div class="words">' + ks.map(k => T.wordHTML(W[k])).join('') + '</div></details>'; })() + '</article>';
  });
  view.innerHTML = h;
}

/* ===== 패턴 ===== */
function viewPattern(){
  view.innerHTML = '<p class="small muted" style="margin-top:14px">교재 문장에서 뽑은 말하기 틀이에요. <span class="badge accent">추가</span> 표시는 시험에 자주 나오는 상황이라 새로 넣은 패턴이에요.</p>' +
    PATTERNS.map((p, i) => '<article class="card"><div class="card-head"><span class="badge">' + (i + 1) + '</span><span class="label" style="color:var(--ink);font-size:16px">' + esc(p.t) + '</span>' + (p.tag ? '<span class="badge accent">' + p.tag + '</span>' : '') + '</div>' +
      '<p style="font-size:18px;font-weight:650;margin:0 0 4px;color:var(--brand-text)">' + esc(p.f) + '</p><p class="small muted" style="margin:0">' + esc(p.d) + '</p>' +
      p.ex.map(s => '<div style="margin-top:10px"><p class="ko" style="margin:0;font-size:15px">' + esc(s.ko) + '</p>' + T.revealHTML(T.sayHTML(s)) + '</div>').join('') + '</article>').join('');
}

/* ===== 단어 ===== */
let wmode = 'list', deck = [], dpos = 0;
function viewWords(){
  const wrongWords = WORDS.filter(([k]) => T.markState('p3w', 'w:' + k) === 'wrong');
  const shown = wordsWrong ? wrongWords : WORDS;
  const ids = shown.map(x => 'w:' + x[0]);
  let h = '<div class="row" style="margin-top:14px"><span class="seg" id="wmode"><button type="button" data-v="list" aria-pressed="' + (wmode === 'list') + '">목록</button><button type="button" data-v="card" aria-pressed="' + (wmode === 'card') + '">카드 넘기기</button></span><span class="spacer"></span><span class="small muted">외운 단어 ' + wprog.count(ids) + ' / ' + ids.length + '</span></div>';
  h += '<div class="chips">' + T.wrongToggle(wordsWrong, wrongWords.length).replace('data-wrongonly', 'data-wordswrong') + '</div>';
  if (!shown.length) h += T.emptyWrong;
  else if (wmode === 'list') h += '<div class="card"><div class="words">' + shown.map(([k, wd]) => T.wordHTML(wd, T.markBtns('p3w', 'w:' + k))).join('') + '</div><p class="small muted" style="margin-bottom:0">단어를 누르면 예문과 비슷한 말·반대말이 나와요. ✓ 외웠어요 · ✗ 틀렸어요</p></div>';
  else {
    if (!deck.length || !deck.every(id => ids.includes(id))) { deck = ids.slice().sort(() => Math.random() - .5); dpos = 0; }
    if (dpos >= deck.length) h += '<div class="card center"><h3>한 바퀴 끝! 👏</h3><button class="btn primary" type="button" id="again">다시 섞어서 시작</button></div>';
    else {
      const wd = W[deck[dpos].slice(2)];
      h += '<div class="small muted" style="margin-top:10px">' + (dpos + 1) + ' / ' + deck.length + '</div><div class="progress" style="margin:6px 0"><i style="width:' + (dpos / deck.length * 100) + '%"></i></div>' +
        '<div class="flash" id="flash"><button class="inner" type="button" aria-label="카드 뒤집기"><div class="face"><div class="small muted">중국어로 말해 보세요</div><div class="big-ko">' + esc(wd[4]) + '</div><div class="small muted">눌러서 뒤집기</div></div>' +
        '<div class="face back"><div class="say"><div class="line py" style="font-size:28px">' + esc(T.pinyinWithExpanded(wd[1])) + '</div><div class="line hg">' + T.toneHTML(wd[2].replaceAll('|', ''), T.hgTones(wd)) + '</div></div></div></button></div>' +
        T.judgeBtns();
    }
  }
  view.innerHTML = h;
  $('#wmode').onclick = e => { const b = e.target.closest('button'); if (b) { wmode = b.dataset.v; deck = []; viewWords(); } };
  const fl = $('#flash'); if (fl) fl.querySelector('.inner').onclick = () => fl.classList.toggle('flipped');
  const next = ok => { const id = deck[dpos]; T.setMark('p3w', id, ok ? 'done' : 'wrong'); if (!ok) deck.push(id); dpos++; summary(); viewWords(); };
  $('#yes') && ($('#yes').onclick = () => next(true));
  $('#no') && ($('#no').onclick = () => next(false));
  $('#again') && ($('#again').onclick = () => { deck = []; viewWords(); });
}

/* ===== 실전 ===== */
const exam = {running: false, results: []};
function viewExam(){
  view.innerHTML = '<div class="card"><h3 style="margin-top:0">⏱ 실전처럼 연습하기</h3><p class="small muted">실제 시험과 같아요: 5문항 · 질문을 읽고 <b>준비 2초</b>, <b>15초 동안 답변</b>.</p>' +
    '<button class="btn primary big" type="button" id="start" style="width:100%">시작하기</button></div>' + (exam.results.length ? resultsHTML() : '');
  $('#start').onclick = runExam; bindResults();
}
async function runExam(){
  exam.results = []; exam.running = true;
  let cancelled = false, cd = null;
  for (let i = 0; i < ITEMS.length && !cancelled; i++) {
    const x = ITEMS[i];
    view.innerHTML = '<div class="card center"><div class="card-head"><span class="badge">문항 ' + (i + 1) + ' / ' + ITEMS.length + '</span><span class="label"></span><button class="btn ghost" type="button" id="quit">그만하기</button></div>' +
      T.sayHTML(x.q) + '<p class="small muted" style="margin:4px 0 0">' + esc(x.q.ko) + '</p>' +
      '<div id="tm"></div></div>';
    $('#quit').onclick = () => { cancelled = true; cd && cd.cancel(); };
    cd = T.countdown($('#tm'), 4, '질문 읽기', 'prep'); if (!(await cd)) { cancelled = true; break; }
    cd = T.countdown($('#tm'), 2, '준비', 'prep'); if (!(await cd)) { cancelled = true; break; }
    cd = T.countdown($('#tm'), 15, '답변');
    const ok = await cd;
    if (!ok) { cancelled = true; break; }
    exam.results.push({x});
  }
  exam.running = false;
  if (cancelled) { exam.results = []; viewExam(); return; }
  view.innerHTML = resultsHTML() + '<div class="row end"><button class="btn primary" type="button" id="restart">한 번 더</button></div>';
  bindResults(); $('#restart').onclick = runExam;
}
function resultsHTML(){
  return '<h2>결과 확인</h2><p class="small muted">모범 답변과 비교하고, 잘 말한 문항은 ‘외웠어요’로 표시하세요.</p>' + exam.results.map(({x}, i) =>
    '<article class="card" data-q="' + x.id + '"><div class="card-head"><span class="badge">문항 ' + (i + 1) + '</span><span class="label">' + esc(x.title) + '</span>' + T.markBtns('p3', x.id) + '</div>' +
    '<p class="ko" style="margin:0">' + esc(x.q.ko) + '</p>' + '<div class="reveal open">' + T.sayHTML(x.q) + '</div>' +
    sayBlock(x.a[0], '모범 답변 ①', true) + sayBlock(x.a[1], '모범 답변 ②', true) + '</article>').join('');
}
function bindResults(){}

/* ===== 탭 ===== */
const TABS = [['learn','학습','📖'],['pattern','패턴','🧩'],['words','단어','🔤'],['exam','실전','⏱']];
const VIEWS = {learn: viewLearn, pattern: viewPattern, words: viewWords, exam: viewExam};
let tab = T.load('tsc-p3-tab', 'learn'); if (!VIEWS[tab]) tab = 'learn';
function go(t){
  if (exam.running) { T.toast('실전 연습 중이에요. ‘그만하기’를 먼저 눌러 주세요.'); T.tabs($('#tabs'), TABS, tab, go); return; }
  tab = t; T.save('tsc-p3-tab', t); T.tabs($('#tabs'), TABS, t, go); VIEWS[t]();
}
view.addEventListener('click', e => { if (e.target.closest('[data-wrongonly]')) { onlyWrong = !onlyWrong; VIEWS[tab](); return; } if (e.target.closest('[data-wordswrong]')) { wordsWrong = !wordsWrong; deck = []; VIEWS[tab](); return; } const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); scrollTo({top: 0}); } });
document.addEventListener('tsc:settings', () => { if (tab !== 'exam') VIEWS[tab](); });
T.onMark = () => {
  summary();
  if (tab === 'learn') { const el = $('#statcard'); if (el) { const d = prog.count(ITEMS.map(x => x.id)); el.querySelector('.stat b').textContent = d; el.querySelector('.progress i').style.width = (d / ITEMS.length * 100) + '%'; } }
  if (tab === 'words' && wmode === 'list') viewWords();
};
T.exampleSource = () => [...ITEMS.flatMap(x => [x.q, ...x.a, ...(x.alt || []).map(a => a.s)]), ...Object.values(NEW)];
summary();
go(tab);
</script>
</body>
</html>
